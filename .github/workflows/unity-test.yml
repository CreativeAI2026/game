name: Unity Tests

# EditMode / PlayMode のテストを走らせる。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unity-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Library
        id: library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.5f1
          testMode: all
          artifactsPath: test-results
          githubToken: ''

      - name: Save Library
        if: github.ref == 'refs/heads/main' && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      - name: サマリを出力
        if: always() # 落ちたときこそ何が落ちたか表で見たい
        run: |
          python3 .github/scripts/test-summary.py \
            "テスト結果" \
            test-results/*.xml | tee summary.md

      # 表を読むのにジョブページを開かせない。PR の会話タブにそのまま貼る。
      # コメントは毎回作らず、マーカーで見つけて上書きする。
      - name: PR にサマリをコメント
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: <!-- unity-test-summary -->
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "$MARKER"; cat summary.md; } > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${id}" -F body=@comment.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -F body=@comment.md
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always() # 落ちたときこそ結果を見たい
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
