name: Unity Compile Check

# StandaloneLinux64 (Mono) でビルドを通すことで「全 asmdef がコンパイルできるか」を検証する。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unity-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (StandaloneLinux64)
    runs-on: ubuntu-latest
    steps:
      # Unity エディタの Docker イメージで空きが足りなくなるので、使わない SDK を先に消す
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Restore Library
        id: library
        uses: actions/cache/restore@v6
        with:
          path: Library
          key: Library-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-
            Library-

      - name: Build (compile check)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.5f1
          targetPlatform: StandaloneLinux64
          allowDirtyBuild: true

      - name: Save Library
        if: github.ref == 'refs/heads/main' && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}
